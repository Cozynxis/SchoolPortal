<!doctype html>
<html lang="nl" data-theme="light" data-accent="blue">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f74bd">
  <meta name="description" content="SchoolPortal — moderne leerling- en docentenomgeving voor Delta College">
  <meta name="color-scheme" content="light dark">
  <meta name="application-name" content="SchoolPortal">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>SchoolPortal · Delta College</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230f74bd'/><path d='M18 23c0-6 5-10 14-10 7 0 12 2 15 5l-6 7c-2-2-5-3-9-3-3 0-5 1-5 3 0 6 22 2 22 15 0 7-6 11-16 11-8 0-15-3-19-7l6-7c3 3 7 5 12 5 4 0 7-1 7-3 0-6-21-2-21-16Z' fill='white'/></svg>">
  <script>
    try {
      const saved = JSON.parse(localStorage.getItem('schoolportal-v3') || '{}');
      if (saved.theme) document.documentElement.dataset.theme = saved.theme;
      if (saved.accent) document.documentElement.dataset.accent = saved.accent;
    } catch (_) {}
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#app">Ga naar inhoud</a>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <main id="app" aria-label="SchoolPortal">
    <div class="boot-screen" aria-hidden="true">
      <div class="boot-logo">S</div>
      <div class="boot-copy"><strong>SchoolPortal</strong><span>Delta College</span></div>
      <div class="boot-line"></div>
    </div>
  </main>

  <dialog id="modal" aria-modal="true">
    <div id="modalBody"></div>
  </dialog>

  <noscript>
    <div class="noscript-message">SchoolPortal heeft JavaScript nodig om te werken.</div>
  </noscript>

  <script src="v3-data.js"></script>
  <script src="v3-core.js"></script>
  <script src="v3-icons.js"></script>
  <script src="v3-student.js"></script>
  <script src="v3-teacher.js"></script>
  <script src="v3-app.js"></script>
  <script src="v3-fixes.js"></script>
  <script src="v3-enhance.js"></script>
</body>
</html>
